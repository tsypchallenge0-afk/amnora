[env:ttgo-t-call-v1_4]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  adafruit/Adafruit MPU6050@^2.2.9
  adafruit/Adafruit SHT31 Library@^2.2.2
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
  bogde/HX711@^0.7.5
